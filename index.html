<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ABA PayWay Integration</title>
    <style>
        body { font-family: sans-serif; display: flex; justify-content: center; padding: 50px; background: #f4f7f6; }
        .card { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); width: 100%; max-width: 400px; }
        input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ddd; border-radius: 4px; box-sizing: border-box; }
        button { width: 100%; padding: 12px; background: #005aab; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: bold; }
        button:hover { background: #004a8d; }
    </style>
</head>
<body>

<div class="card">
    <h2>Checkout</h2>
    <input type="number" id="amount" placeholder="Amount (USD)" value="1.00">
    <input type="text" id="firstname" placeholder="First Name" value="John">
    <input type="text" id="lastname" placeholder="Last Name" value="Doe">
    <input type="email" id="email" placeholder="Email" value="test@example.com">
    <button onclick="checkout()">Pay with ABA</button>
</div>

<form id="payway-form" method="POST" action="https://checkout-sandbox.payway.com.kh/api/payment-gateway/v1/payments/purchase">
    <div id="form-inputs"></div>
</form>

<script>
    async function checkout() {
        const RENDER_URL = "https://your-app-name.onrender.com"; // CHANGE THIS to your Render URL
        
        const paymentData = {
            amount: document.getElementById('amount').value,
            tran_id: "INV-" + Date.now(),
            firstname: document.getElementById('firstname').value,
            lastname: document.getElementById('lastname').value,
            email: document.getElementById('email').value,
            phone: "012345678"
        };

        try {
            // 1. Get Hash from your Render Server
            const response = await fetch(`${RENDER_URL}/create-payment`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(paymentData)
            });
            
            const data = await response.json();

            // 2. Populate the hidden form
            const formContainer = document.getElementById('form-inputs');
            formContainer.innerHTML = ''; // Clear old inputs
            
            for (const key in data) {
                const input = document.createElement('input');
                input.type = 'hidden';
                input.name = key;
                input.value = data[key];
                formContainer.appendChild(input);
            }

            // 3. Submit to PayWay
            document.getElementById('payway-form').submit();

        } catch (error) {
            alert("Error connecting to server. Check console.");
            console.error(error);
        }
    }
</script>

</body>
</html>
